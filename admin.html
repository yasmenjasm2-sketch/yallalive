<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - تعبئة البطاقات</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-panel { background: #34495e; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #f1c40f; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: none; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        input:focus { outline: 2px solid #f1c40f; }
        .btn-charge { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-charge:hover { background: #2ecc71; }
    </style>
</head>
<body>

<div class="admin-panel">
    <h2>لوحة تحكم شحن النقاط (الأدمن)</h2>
    
    <div class="form-group">
        <label>رقم بطاقة المستخدم (16 رقم):</label>
        <input type="text" id="admin-card-number" placeholder="مثال: 1234567890123456" maxlength="19">
    </div>

    <div class="form-group">
        <label>كمية الشحن (بالدولار = نقاط):</label>
        <input type="number" id="admin-amount" placeholder="أدخل المبلغ بالدولار">
    </div>

    <button class="btn-charge" onclick="adminChargeCard()">شحن البطاقة الآن</button>
</div>

<!-- استدعاء ملف النقاط للاستفادة من اتصال قواعد البيانات الموجود فيه -->
<script src="points.js"></script>
</body>
</html>
