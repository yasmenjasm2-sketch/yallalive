<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - شحن البطاقات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-panel { background: #34495e; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 16px; text-align: center; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background: #2ecc71; }
        #admin-msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <h2>لوحة شحن النقاط (للأدمن)</h2>
        <p>1 نقطة = 1 دولار</p>
        
        <input type="text" id="cardInput" placeholder="أدخل رقم البطاقة (16 رقم)" maxlength="16">
        <input type="number" id="amountInput" placeholder="المبلغ بالدولار (النقاط)">
        
        <button onclick="processCharge()">شحن الرصيد</button>

        <div id="admin-msg"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="points.js"></script>

    <script>
        function processCharge() {
            const card = document.getElementById('cardInput').value.trim();
            const amount = document.getElementById('amountInput').value.trim();
            
            if (card.length !== 16 || isNaN(card)) {
                document.getElementById('admin-msg').innerHTML = '<span style="color:red;">رقم البطاقة غير صحيح! يجب أن يتكون من 16 رقم.</span>';
                return;
            }
            if (amount <= 0 || isNaN(amount)) {
                document.getElementById('admin-msg').innerHTML = '<span style="color:red;">يرجى إدخال مبلغ صحيح.</span>';
                return;
            }
            
            // استدعاء دالة الشحن الموجودة في ملف points.js
            adminChargeWallet(card, amount);
        }
    </script>
</body>
</html>
