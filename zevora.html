<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="ZEVORA - منصة إنشاء المتاجر الإلكترونية ونشر المنتجات" />
<meta name="theme-color" content="#0a0e1a" />
<title>ZEVORA | زيفوره – منصة المتاجر الإلكترونية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23d4af37' font-family='Arial'%3EZ%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

<style>
/* ==================================================================
   ZEVORA – Luxury E-Commerce Platform Styles v2.0
   ================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #05070e;
  --bg-1: #0a0e1a;
  --bg-2: #0f1420;
  --bg-3: #151b2b;
  --card: rgba(255, 255, 255, 0.035);
  --card-hover: rgba(255, 255, 255, 0.06);
  --border: rgba(212, 175, 55, 0.18);
  --border-soft: rgba(255, 255, 255, 0.06);
  --gold: #d4af37;
  --gold-light: #f4e5b1;
  --gold-dark: #a8861e;
  --text: #e8ecf4;
  --text-muted: #9aa3b8;
  --text-dim: #5a6478;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-gold: 0 6px 24px rgba(212, 175, 55, 0.15);
  --grad-gold: linear-gradient(135deg, #f9e79f 0%, #d4af37 50%, #a8861e 100%);
  --font: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg-0);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.65;
  font-size: 15px;
  overflow-x: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(20, 30, 60, 0.6) 0%, transparent 70%);
  z-index: -2;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: -1;
  pointer-events: none;
  opacity: 0.5;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }
img { max-width: 100%; display: block; }
.hidden { display: none !important; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-1); }
::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* NAVBAR */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5, 7, 14, 0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-soft);
}
.nav-inner {
  max-width: 1400px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; transition: transform 0.3s ease; }
.brand:hover { transform: scale(1.03); }
.z-logo { width: 42px; height: 42px; }
.brand-text {
  font-size: 22px; font-weight: 900; letter-spacing: 2px;
  background: var(--grad-gold);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }
.nav-toggle span { width: 24px; height: 2px; background: var(--gold); border-radius: 2px; transition: all 0.3s; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-links > a {
  padding: 8px 16px; border-radius: var(--radius-sm);
  color: var(--text-muted); font-weight: 500; font-size: 14px; transition: all 0.2s;
}
.nav-links > a:hover { color: var(--gold); background: rgba(212, 175, 55, 0.06); }
.nav-links > a.active { color: var(--gold); }
.btn-nav-gold { background: var(--grad-gold); color: #0a0e1a !important; font-weight: 700; box-shadow: var(--shadow-gold); }
.btn-nav-gold:hover { transform: translateY(-1px); filter: brightness(1.05); }
.user-menu { position: relative; }
.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 6px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); transition: all 0.2s;
}
.user-btn:hover { background: var(--card-hover); }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--grad-gold); color: #0a0e1a; font-weight: 900;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  object-fit: cover;
}
.user-name { font-size: 13px; font-weight: 600; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dropdown {
  position: absolute; top: calc(100% + 8px); left: 0; min-width: 200px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 6px; display: none; z-index: 50;
}
.dropdown.open { display: block; animation: dropIn 0.2s ease; }
.dropdown a, .dropdown button {
  display: block; width: 100%; text-align: right; padding: 10px 14px;
  border-radius: var(--radius-sm); font-size: 14px;
  color: var(--text-muted); transition: all 0.15s;
}
.dropdown a:hover, .dropdown button:hover { background: rgba(212, 175, 55, 0.08); color: var(--gold); }
.logout-btn { color: var(--danger) !important; }
.logout-btn:hover { background: rgba(239, 68, 68, 0.1) !important; color: var(--danger) !important; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

/* APP */
.app-container { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 30px 24px 60px; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 700;
  transition: all 0.2s ease; white-space: nowrap; border: 1px solid transparent;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--grad-gold); color: #0a0e1a; box-shadow: var(--shadow-gold); }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
.btn-ghost { background: var(--card); color: var(--text); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { background: var(--card-hover); border-color: var(--gold); }
.btn-danger { background: rgba(239, 68, 68, 0.12); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
.btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.2); }
.btn-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
.btn-success:hover:not(:disabled) { background: rgba(16, 185, 129, 0.25); }
.btn-sm { padding: 8px 16px; font-size: 13px; }
.btn-lg { padding: 16px 32px; font-size: 16px; }
.btn-block { width: 100%; }
.btn-icon { padding: 10px; width: 40px; height: 40px; border-radius: 50%; }

.btn-google {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 14px 20px;
  background: #fff; color: #1f1f1f;
  border: 1px solid #dadce0;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600;
  transition: all 0.2s;
}
.btn-google:hover { background: #f7f7f7; box-shadow: 0 1px 6px rgba(0,0,0,0.15); transform: translateY(-1px); }
.btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-google svg { flex-shrink: 0; }

.divider-text {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0; color: var(--text-dim); font-size: 13px;
}
.divider-text::before, .divider-text::after {
  content: ''; flex: 1; height: 1px; background: var(--border-soft);
}

/* FORMS */
.form-group { margin-bottom: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
.form-label .req { color: var(--danger); }
.form-control {
  width: 100%; padding: 12px 16px;
  background: var(--bg-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
  transition: all 0.2s;
}
.form-control:focus { outline: none; border-color: var(--gold); background: var(--bg-3); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1); }
.form-control::placeholder { color: var(--text-dim); }
textarea.form-control { resize: vertical; min-height: 100px; }
select.form-control { cursor: pointer; }
.form-help { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.form-error {
  padding: 12px 16px; background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-sm);
  color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none;
}
.form-error.show { display: block; animation: shake 0.3s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* UPLOAD */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer;
  transition: all 0.2s; background: var(--bg-2);
}
.upload-zone:hover { border-color: var(--gold); background: var(--bg-3); }
.upload-zone svg { width: 40px; height: 40px; stroke: var(--gold); margin: 0 auto 12px; }
.upload-zone p { color: var(--text-muted); font-size: 14px; }
.upload-zone small { color: var(--text-dim); font-size: 12px; }
.upload-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.upload-preview .preview-item {
  position: relative; width: 90px; height: 90px;
  border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--border);
}
.upload-preview img { width: 100%; height: 100%; object-fit: cover; }
.upload-preview .remove-img {
  position: absolute; top: 4px; left: 4px; width: 22px; height: 22px;
  border-radius: 50%; background: rgba(239, 68, 68, 0.9);
  color: white; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}

/* CARDS */
.card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg); padding: 24px; transition: all 0.3s ease;
}
.card:hover { border-color: var(--border); }
.section-title {
  font-size: 22px; font-weight: 800; margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: ''; width: 4px; height: 24px;
  background: var(--grad-gold); border-radius: 2px;
}

/* HERO */
.hero {
  position: relative; padding: 60px 40px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(20, 30, 60, 0.3) 100%);
  border: 1px solid var(--border);
  margin-bottom: 50px; overflow: hidden; text-align: center;
}
.hero::before {
  content: ''; position: absolute; top: -50%; right: -10%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero h1 { font-size: clamp(28px, 5vw, 52px); font-weight: 900; line-height: 1.2; margin-bottom: 16px; }
.hero h1 span {
  background: var(--grad-gold);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { font-size: 17px; color: var(--text-muted); max-width: 640px; margin: 0 auto 30px; }
.hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.search-bar { max-width: 700px; margin: 0 auto 24px; position: relative; }
.search-bar input {
  width: 100%; padding: 16px 56px 16px 20px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 999px; color: var(--text); font-size: 15px;
}
.search-bar input:focus { outline: none; border-color: var(--gold); }
.search-bar .search-icon {
  position: absolute; top: 50%; right: 20px;
  transform: translateY(-50%); color: var(--gold);
}

.stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 50px; }
.stat-box {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 20px; text-align: center;
  transition: all 0.25s;
}
.stat-box:hover { border-color: var(--border); transform: translateY(-2px); }
.stat-value {
  font-size: 28px; font-weight: 900;
  background: var(--grad-gold);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* CATEGORIES SHOWCASE */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  margin-bottom: 50px;
}
.category-card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 20px 12px;
  text-align: center; cursor: pointer; transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.category-card:hover {
  border-color: var(--gold); transform: translateY(-3px);
  box-shadow: var(--shadow-gold);
}
.category-card svg { width: 36px; height: 36px; stroke: var(--gold); }
.category-card span { font-size: 13px; font-weight: 600; }

/* HOW IT WORKS */
.how-it-works {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 50px;
}
.step-card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg); padding: 30px 24px;
  text-align: center; position: relative;
  transition: all 0.3s;
}
.step-card:hover { border-color: var(--border); transform: translateY(-3px); }
.step-num {
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--grad-gold); color: #0a0e1a;
  font-size: 22px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  box-shadow: var(--shadow-gold);
}
.step-card h3 { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
.step-card p { font-size: 13px; color: var(--text-muted); }

/* NEWSLETTER */
.newsletter-box {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(20, 30, 60, 0.4) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  text-align: center;
  margin-bottom: 50px;
}
.newsletter-box h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
.newsletter-box p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
.newsletter-form {
  display: flex; gap: 10px; max-width: 500px; margin: 0 auto;
}
.newsletter-form input {
  flex: 1; padding: 14px 18px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
}
.newsletter-form input:focus { outline: none; border-color: var(--gold); }

/* PRODUCTS GRID */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.product-card {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: var(--radius); overflow: hidden; cursor: pointer;
  transition: all 0.3s ease; display: flex; flex-direction: column;
  position: relative;
}
.product-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: var(--shadow-gold);
}
.product-image {
  position: relative; aspect-ratio: 1 / 1;
  background: var(--bg-2); overflow: hidden;
}
.product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.product-card:hover .product-image img { transform: scale(1.08); }
.product-badge {
  position: absolute; top: 10px; right: 10px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
  background: rgba(212, 175, 55, 0.95); color: #0a0e1a;
}
.product-badge.sale { background: var(--danger); color: white; }
.product-badge.used { background: var(--warning); color: #0a0e1a; }
.product-badge.featured { background: var(--gold); color: #0a0e1a; top: 10px; left: 10px; right: auto; }
.wishlist-btn {
  position: absolute; bottom: 10px; left: 10px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: all 0.2s;
  border: 1px solid var(--border-soft);
}
.wishlist-btn:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
.wishlist-btn.active { color: var(--danger); background: rgba(239, 68, 68, 0.15); }
.wishlist-btn svg { width: 18px; height: 18px; }

.product-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.product-name {
  font-size: 14px; font-weight: 700; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.product-store { font-size: 12px; color: var(--text-dim); }
.product-rating {
  display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--warning);
}
.product-rating .star { font-size: 12px; }
.product-rating .count { color: var(--text-dim); margin-right: 4px; }
.product-price { display: flex; align-items: baseline; gap: 8px; margin-top: auto; }
.price-current { font-size: 17px; font-weight: 900; color: var(--gold); }
.price-old { font-size: 13px; color: var(--text-dim); text-decoration: line-through; }

/* STORE PAGE */
.store-cover {
  height: 240px; border-radius: var(--radius-lg);
  background-size: cover; background-position: center;
  background-color: var(--bg-2); border: 1px solid var(--border);
  position: relative; overflow: hidden; margin-bottom: -60px;
}
.store-header {
  position: relative; padding: 0 40px;
  display: flex; align-items: flex-end; gap: 20px; margin-bottom: 30px;
}
.store-logo {
  width: 120px; height: 120px; border-radius: 24px;
  background: var(--bg-3); border: 4px solid var(--bg-1);
  object-fit: cover; flex-shrink: 0; box-shadow: var(--shadow);
}
.store-info { flex: 1; padding-bottom: 8px; }
.store-name { font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verified-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 700;
  background: rgba(59, 130, 246, 0.15); color: #3b82f6;
  padding: 3px 10px; border-radius: 999px;
}
.store-desc { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
.store-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--text-dim); }
.store-meta span { display: flex; align-items: center; gap: 4px; }
.store-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* PRODUCT DETAIL */
.product-detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; }
.product-gallery { position: sticky; top: 100px; }
.gallery-main {
  aspect-ratio: 1/1; background: var(--bg-2);
  border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 12px;
  position: relative;
}
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.gallery-thumbs .thumb {
  width: 70px; height: 70px; border-radius: var(--radius-sm);
  overflow: hidden; border: 2px solid transparent;
  cursor: pointer; flex-shrink: 0; transition: border-color 0.2s;
}
.gallery-thumbs .thumb img { width: 100%; height: 100%; object-fit: cover; }
.gallery-thumbs .thumb.active { border-color: var(--gold); }
.product-info h1 { font-size: 28px; font-weight: 900; margin-bottom: 12px; line-height: 1.3; }
.product-info .store-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--gold); margin-bottom: 16px;
}
.product-info .rating-line {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  font-size: 14px;
}
.product-info .rating-line .stars { color: var(--warning); letter-spacing: 2px; }

/* ================= UTILS ================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const appEl = $("#app");

function esc(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function slugify(str) {
  return String(str || "").trim().toLowerCase()
    .replace(/[\s\u0640]+/g, "-")
    .replace(/[^\w\u0600-\u06FF-]/g, "")
    .replace(/-+/g, "-").replace(/^-|-$/g, "") || "store";
}
function formatPrice(price, currency = "SAR") {
  const n = Number(price) || 0;
  const sym = CURRENCY_SYMBOLS[currency] || currency;
  return `${n.toLocaleString("ar-EG")} ${sym}`;
}
function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(typeof ts === "number" ? ts : Date.parse(ts));
  if (isNaN(d)) return "";
  return d.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" });
}
function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function cleanPhone(p) { return String(p || "").replace(/[^\d]/g, ""); }
function debounce(fn, wait) {
  let t;
  return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
}
function objectURL(file) {
  if (!state.previewCache.has(file)) {
    state.previewCache.set(file, URL.createObjectURL(file));
  }
  return state.previewCache.get(file);
}

/* ================= TOAST ================= */
function toast(msg, type = "info", duration = 3500) {
  const c = $("#toastContainer");
  if (!c) return;
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(20px)";
    el.style.transition = "all 0.3s";
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function showLoader(show, text = "جارٍ التحميل...") {
  const el = $("#globalLoader");
  if (!el) return;
  $("#loaderText").textContent = text;
  el.classList.toggle("hidden", !show);
  state.isLoading = show;
}

/* ================= CONFIRM ================= */
function confirmDialog(message, title = "تأكيد العملية") {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn btn-danger" id="mConfirm">تأكيد</button>
          <button class="btn btn-ghost" id="mCancel">إلغاء</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#mConfirm").onclick = () => { overlay.remove(); resolve(true); };
    overlay.querySelector("#mCancel").onclick = () => { overlay.remove(); resolve(false); };
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
  });
}

/* ================= STORAGE ================= */
async function uploadImage(file, path) {
  if (!file) return null;
  if (!file.type.startsWith("image/")) throw new Error("الملف ليس صورة");
  if (file.size > 5 * 1024 * 1024) throw new Error("حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)");
  const ext = file.name.split(".").pop() || "jpg";
  const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const storageReference = stRef(storage, `${path}/${fileName}`);
  await uploadBytes(storageReference, file);
  return await getDownloadURL(storageReference);
}
async function deleteImageByUrl(url) {
  if (!url) return;
  try { await deleteObject(stRef(storage, url)); } catch (e) { console.warn("del img:", e); }
}

/* ================= CLIPBOARD / SHARE ================= */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}
function shareUrl_(url, title) {
  if (navigator.share) {
    navigator.share({ title: title || "ZEVORA", url }).catch(() => {});
  } else {
    copyText(url);
    toast("تم نسخ الرابط للمشاركة", "success");
  }
}

/* ================= WISHLIST ================= */
function getLocalWishlist() {
  try { return JSON.parse(localStorage.getItem("zevora_wishlist") || "[]"); }
  catch { return []; }
}
function setLocalWishlist(arr) {
  try { localStorage.setItem("zevora_wishlist", JSON.stringify(arr)); }
  catch (e) { console.warn(e); }
}
async function loadWishlist() {
  if (state.user) {
    try {
      const snap = await dbGet(dbRef(db, `wishlists/${state.user.uid}`));
      const data = snap.val() || {};
      state.wishlist = Object.keys(data);
    } catch { state.wishlist = getLocalWishlist(); }
  } else {
    state.wishlist = getLocalWishlist();
  }
}
async function toggleWishlist(pid) {
  const isFav = state.wishlist.includes(pid);
  if (isFav) {
    state.wishlist = state.wishlist.filter(x => x !== pid);
    toast("تمت الإزالة من المفضلة", "info", 2000);
  } else {
    state.wishlist.push(pid);
    toast("تمت الإضافة للمفضلة ❤️", "success", 2000);
  }
  if (state.user) {
    try {
      if (isFav) await dbRemove(dbRef(db, `wishlists/${state.user.uid}/${pid}`));
      else await dbSet(dbRef(db, `wishlists/${state.user.uid}/${pid}`), { addedAt: Date.now() });
    } catch (e) { console.warn(e); }
  } else {
    setLocalWishlist(state.wishlist);
  }
  return !isFav;
}

/* ================= ROUTER ================= */
function navigate(hash) {
  if (location.hash === hash) router();
  else location.hash = hash;
}

async function router() {
  const hash = (location.hash || "#/").replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);

  try {
    showLoader(true);
    const protectedRoutes = ["dashboard", "settings"];
    if (protectedRoutes.includes(parts[0]) && !state.user) {
      toast("يجب تسجيل الدخول أولاً", "warning");
      showLoader(false);
      navigate("#/login");
      return;
    }

    if (!parts[0] || parts[0] === "home") await renderHome();
    else if (parts[0] === "login") renderLogin();
    else if (parts[0] === "register") renderRegister();
    else if (parts[0] === "store" && parts[1]) await renderStore(parts[1]);
    else if (parts[0] === "product" && parts[1]) await renderProduct(parts[1]);
    else if (parts[0] === "search") await renderSearch();
    else if (parts[0] === "wishlist") await renderWishlist();
    else if (parts[0] === "dashboard") {
      if (parts[1] === "store") await renderStoreEdit();
      else if (parts[1] === "product" && parts[2] === "new") await renderProductForm();
      else if (parts[1] === "product" && parts[2]) await renderProductForm(parts[2]);
      else await renderDashboard();
    }
    else if (parts[0] === "settings") renderSettings();
    else render404();
  } catch (err) {
    console.error(err);
    toast(err.message || "حدث خطأ", "error");
    render404();
  } finally {
    showLoader(false);
    updateNavActive();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function updateNavActive() {
  const hash = location.hash || "#/";
  $$(".nav-links > a").forEach(a => a.classList.remove("active"));
  if (hash.startsWith("#/dashboard")) $('[data-nav="dashboard"]')?.classList.add("active");
  else if (hash.startsWith("#/search")) $('[data-nav="search"]')?.classList.add("active");
  else if (hash.startsWith("#/wishlist")) $('[data-nav="wishlist"]')?.classList.add("active");
  else if (hash === "#/" || hash === "") $('[data-nav="home"]')?.classList.add("active");
}

/* ================= AUTH ================= */
async function handleLogin(email, password) {
  if (!validateEmail(email)) throw new Error("بريد إلكتروني غير صحيح");
  if (password.length < 6) throw new Error("كلمة المرور 6 أحرف على الأقل");
  await signInWithEmailAndPassword(auth, email, password);
}
async function handleRegister(email, password, name) {
  if (!name.trim()) throw new Error("الاسم مطلوب");
  if (!validateEmail(email)) throw new Error("بريد إلكتروني غير صحيح");
  if (password.length < 6) throw new Error("كلمة المرور 6 أحرف على الأقل");
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await updateProfile(cred.user, { displayName: name });
  await dbSet(dbRef(db, `users/${cred.user.uid}`), {
    email, name, uid: cred.user.uid, createdAt: Date.now(), provider: "email"
  });
}
async function handleGoogleSignIn() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    // Ensure user record exists (only create if not present)
    const snap = await dbGet(dbRef(db, `users/${user.uid}`));
    if (!snap.exists()) {
      await dbSet(dbRef(db, `users/${user.uid}`), {
        email: user.email,
        name: user.displayName || (user.email ? user.email.split("@")[0] : "مستخدم"),
        photoURL: user.photoURL || "",
        uid: user.uid,
        provider: "google",
        createdAt: Date.now()
      });
    }
    toast("تم تسجيل الدخول عبر Google ✅", "success");
    navigate("#/dashboard");
  } catch (err) {
    if (err.code === "auth/popup-blocked") {
      toast("المتصفح منع النافذة المنبثقة، الرجاء السماح بها والمحاولة مجدداً", "error", 5000);
    } else if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") {
      // silent
    } else if (err.code === "auth/account-exists-with-different-credential") {
      toast("هذا البريد مسجل بطريقة أخرى. استخدم تسجيل الدخول بالبريد", "error", 5000);
    } else if (err.code === "auth/unauthorized-domain") {
      toast("هذا النطاق غير مصرح به في Firebase Authentication. أضف نطاق موقعك في Google Console", "error", 6000);
    } else {
      toast(mapAuthError(err.code) || err.message, "error");
    }
  }
}
async function handleLogout() {
  await signOut(auth);
  toast("تم تسجيل الخروج", "success");
  navigate("#/");
}
async function handleReset(email) {
  if (!validateEmail(email)) throw new Error("بريد إلكتروني غير صحيح");
  await sendPasswordResetEmail(auth, email);
  toast("تم إرسال رابط استعادة كلمة المرور إلى بريدك", "success", 5000);
}

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  state.authReady = true;
  if (user) {
    try {
      const snap = await dbGet(dbRef(db, `users/${user.uid}`));
      state.profile = snap.val() || {
        email: user.email, name: user.displayName || "مستخدم",
        photoURL: user.photoURL || ""
      };
      // If DB record missing for Google users, create it
      if (!snap.exists()) {
        await dbSet(dbRef(db, `users/${user.uid}`), {
          email: user.email || "",
          name: user.displayName || (user.email ? user.email.split("@")[0] : "مستخدم"),
          photoURL: user.photoURL || "",
          uid: user.uid,
          provider: user.providerData?.[0]?.providerId || "email",
          createdAt: Date.now()
        });
      }
      const storeSnap = await dbGet(dbRef(db, `stores/${user.uid}`));
      state.myStore = storeSnap.val() || null;
      await loadMyProducts(user.uid);
      await loadWishlist();
    } catch (e) { console.warn(e); }
  } else {
    state.profile = null;
    state.myStore = null;
    state.myProducts = [];
    state.wishlist = getLocalWishlist();
  }
  updateAuthUI();
  if (location.hash.includes("dashboard") || location.hash.includes("settings") || location.hash.includes("wishlist")) router();
});

async function loadMyProducts(uid) {
  const snap = await dbGet(query(dbRef(db, "products"), orderByChild("ownerId"), equalTo(uid)));
  const data = snap.val() || {};
  state.myProducts = Object.entries(data).map(([id, v]) => ({ id, ...v }));
}

function updateAuthUI() {
  const guestOnly = $$(".guest-only");
  const authOnly = $$(".auth-only");
  const userMenu = $("#userMenu");
  if (state.user) {
    guestOnly.forEach(e => e.classList.add("hidden"));
    authOnly.forEach(e => e.classList.remove("hidden"));
    userMenu?.classList.remove("hidden");
    const name = state.profile?.name || state.user.email?.split("@")[0] || "مستخدم";
    $("#userName").textContent = name;
    $("#userAvatar").textContent = name.charAt(0).toUpperCase();
    const photo = state.profile?.photoURL || state.user.photoURL || "";
    const img = $("#userAvatarImg");
    if (photo && img) {
      img.src = photo;
      img.classList.remove("hidden");
      $("#userAvatar").classList.add("hidden");
    } else if (img) {
      img.classList.add("hidden");
      $("#userAvatar").classList.remove("hidden");
    }
  } else {
    guestOnly.forEach(e => e.classList.remove("hidden"));
    authOnly.forEach(e => e.classList.add("hidden"));
    userMenu?.classList.add("hidden");
  }
}

function mapAuthError(code) {
  const map = {
    "auth/invalid-email": "البريد الإلكتروني غير صحيح",
    "auth/user-not-found": "لا يوجد حساب بهذا البريد",
    "auth/wrong-password": "كلمة المرور غير صحيحة",
    "auth/invalid-credential": "بيانات الدخول غير صحيحة",
    "auth/email-already-in-use": "هذا البريد مسجل بالفعل",
    "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)",
    "auth/too-many-requests": "محاولات كثيرة، حاول لاحقاً",
    "auth/network-request-failed": "تعذر الاتصال، تحقق من الإنترنت",
    "auth/operation-not-allowed": "طريقة تسجيل الدخول هذه غير مفعّلة في Firebase Console"
  };
  return map[code];
}

    const name = $("#regName").value.trim();
    const email = $("#regEmail").value.trim();
    const password = $("#regPassword").value;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "جارٍ الإنشاء...";
    try {
      await handleRegister(email, password, name);
      toast("تم إنشاء الحساب بنجاح", "success");
      navigate("#/dashboard");
    } catch (err) {
      errEl.textContent = mapAuthError(err.code) || err.message;
      errEl.classList.add("show");
    } finally {
      btn.disabled = false; btn.textContent = "إنشاء الحساب";
    }
  };
}

function productCardHTML(p, store) {
  const mainImg = (p.images && p.images[0]) || "https://via.placeholder.com/400x400/151b2b/5a6478?text=ZEVORA";
  const hasDiscount = p.oldPrice && Number(p.oldPrice) > Number(p.price);
  const isFav = state.wishlist.includes(p.id);
  const rating = Number(p.ratingAvg) || 0;
  const ratingCount = Number(p.ratingCount) || 0;
  return `
    <div class="product-card" data-pid="${p.id}">
      <div class="product-image">
        <img src="${esc(mainImg)}" alt="${esc(p.name)}" loading="lazy" />
        ${hasDiscount ? '<span class="product-badge sale">خصم</span>' : ''}
        ${p.condition === "used" ? '<span class="product-badge used">مستعمل</span>' : ''}
        ${p.featured ? '<span class="product-badge featured">⭐ مميز</span>' : ''}
        <button class="wishlist-btn ${isFav ? 'active' : ''}" data-wishlist="${p.id}" title="المفضلة">
          <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
      <div class="product-body">
        <div class="product-name">${esc(p.name)}</div>
        <div class="product-store">${esc(store?.name || "متجر")}</div>
        ${ratingCount > 0 ? `
          <div class="product-rating">
            <span class="star">★</span>
            <span>${rating.toFixed(1)}</span>
            <span class="count">(${ratingCount})</span>
          </div>
        ` : ""}
        <div class="product-price">
          <span class="price-current">${formatPrice(p.price, p.currency)}</span>
          ${hasDiscount ? `<span class="price-old">${formatPrice(p.oldPrice, p.currency)}</span>` : ''}

    </div>`;
}

async function applySearch() {
  state.currentFilters.q = $("#fq")?.value || "";
  state.currentFilters.category = $("#fcat")?.value || "";
  state.currentFilters.country = $("#fcountry")?.value || "";
  state.currentFilters.minPrice = $("#fmin")?.value || "";
  state.currentFilters.maxPrice = $("#fmax")?.value || "";
  state.currentFilters.sort = $("#fsort")?.value || "newest";

  const resultsEl = $("#searchResults");
  const countEl = $("#resultsCount");
  if (!resultsEl) return;
  resultsEl.innerHTML = `<p style="color:var(--text-muted)">جارٍ البحث...</p>`;

  const [prodSnap, storeSnap] = await Promise.all([
    dbGet(dbRef(db, "products")),
    dbGet(dbRef(db, "stores"))
  ]);
  const products = prodSnap.val() || {};
  const stores = storeSnap.val() || {};
  const storeMap = {};
  Object.entries(stores).forEach(([uid, v]) => { storeMap[uid] = { uid, ...v }; });

  let list = Object.entries(products).map(([id, v]) => ({ id, ...v })).filter(p => p.status === "published");
  const f = state.currentFilters;
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter(p =>
      (p.name || "").toLowerCase().includes(q) ||
      (p.description || "").toLowerCase().includes(q) ||
      (p.category || "").toLowerCase().includes(q) ||
      (storeMap[p.ownerId]?.name || "").toLowerCase().includes(q)
    );
  }
  if (f.category) list = list.filter(p => p.category === f.category);
  if (f.country) list = list.filter(p => storeMap[p.ownerId]?.country === f.country);
  if (f.minPrice) list = list.filter(p => Number(p.price) >= Number(f.minPrice));
  if (f.maxPrice) list = list.filter(p => Number(p.price) <= Number(f.maxPrice));

  if (f.sort === "popular") list.sort((a, b) => (b.views || 0) - (a.views || 0));
  else if (f.sort === "price-asc") list.sort((a, b) => Number(a.price) - Number(b.price));
  else if (f.sort === "price-desc") list.sort((a, b) => Number(b.price) - Number(a.price));
  else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  countEl.textContent = `${list.length.toLocaleString("ar-EG")} نتيجة`;
  resultsEl.innerHTML = list.length
    ? list.map(p => productCardHTML(p, storeMap[p.ownerId])).join("")
    : `<div class="empty-state" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <h3>لا توجد نتائج</h3><p>جرّب تغيير الفلاتر</p>
      </div>`;
  bindProductCards();
}

/* ================= RENDER: PRODUCT ================= */
async function renderProduct(pid) {
  const snap = await dbGet(dbRef(db, "products/" + pid));
  if (!snap.exists()) { render404("المنتج غير موجود"); return; }
  const p = { id: pid, ...snap.val() };
  if (p.status !== "published" && state.user?.uid !== p.ownerId) { render404("المنتج غير منشور"); return; }

  // Increment views once per session per product
  try {
    const viewKey = `zevora_view_${pid}`;
    if (!sessionStorage.getItem(viewKey)) {
      await dbUpdate(dbRef(db, "products/" + pid), { views: increment(1) });
      sessionStorage.setItem(viewKey, "1");
    }
  } catch (e) { console.warn(e); }

  const storeSnap = await dbGet(dbRef(db, "stores/" + p.ownerId));
  const store = storeSnap.val() || {};

  const reviewsSnap = await dbGet(dbRef(db, "reviews/" + pid));
  const reviewsData = reviewsSnap.val() || {};
  const reviews = Object.entries(reviewsData).map(([id, v]) => ({ id, ...v }));

  const images = (p.images && p.images.length) ? p.images : ["https://via.placeholder.com/600x600/151b2b/5a6478?text=ZEVORA"];
  const hasDiscount = p.oldPrice && Number(p.oldPrice) > Number(p.price);
  const discountPct = hasDiscount ? Math.round((1 - Number(p.price) / Number(p.oldPrice)) * 100) : 0;
  const shareUrl = `${location.origin}${location.pathname}?p=${p.id}`;
  const isFav = state.wishlist.includes(p.id);
  const rating = Number(p.ratingAvg) || 0;
  const ratingCount = Number(p.ratingCount) || 0;

  appEl.innerHTML = `
    <div class="product-detail">
      <div class="product-gallery">
        <div class="gallery-main"><img id="mainImg" src="${esc(images[0])}" alt="${esc(p.name)}" /></div>
        <div class="gallery-thumbs" id="galleryThumbs">
          ${images.map((img, i) => `<div class="thumb ${i === 0 ? 'active' : ''}" data-img="${esc(img)}"><img src="${esc(img)}" alt="" /></div>`).join("")}

      </div>
      <div class="product-info">
        <a class="store-link" href="#/store/${esc(store.slug || p.ownerId)}">🏪 ${esc(store.name || "المتجر")} ←</a>
        <h1>${esc(p.name)}</h1>

        ${ratingCount > 0 ? `
          <div class="rating-line">
            <span class="stars">${"★".repeat(Math.round(rating))}${"☆".repeat(5 - Math.round(rating))}</span>
            <span class="num">${rating.toFixed(1)}</span>
            <span class="count">(${ratingCount} تقييم)</span>
          </div>
        ` : ""}

        <div class="price-block">
          ${hasDiscount ? `<div style="margin-bottom:6px"><span class="old">${formatPrice(p.oldPrice, p.currency)}</span> <span class="discount">-${discountPct}%</span></div>` : ""}
          <div class="current">${formatPrice(p.price, p.currency)}</div>
        </div>
        <div class="info-list">
          <div class="info-row"><span class="label">التصنيف</span><span class="value">${esc(p.category || "—")}</span></div>
          <div class="info-row"><span class="label">الحالة</span><span class="value">${p.condition === "used" ? "مستعمل" : "جديد"}</span></div>
          <div class="info-row"><span class="label">التوفر</span><span class="value ${p.available !== false ? 'available' : 'unavailable'}">${p.available !== false ? (p.quantity ? `${p.quantity} متوفر` : "متوفر") : "غير متوفر"}</span></div>
          <div class="info-row"><span class="label">المشاهدات</span><span class="value">${(Number(p.views) || 0).toLocaleString("ar-EG")}</span></div>
        </div>
        <div class="contact-actions">
          ${p.whatsapp ? `<a class="btn btn-whatsapp" target="_blank" rel="noopener" href="https://wa.me/${cleanPhone(p.whatsapp)}?text=${encodeURIComponent('مرحباً، أستفسر عن: ' + p.name + '\n' + shareUrl)}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.4.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.2-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5-.2 0-.4 0-.6 0-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.2 3 .1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.2-1.3c1.4.8 3 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
            واتساب
          </a>` : `<button class="btn btn-ghost" disabled>لا يوجد واتساب</button>`}
          ${p.phone ? `<a class="btn btn-call" href="tel:${esc(p.phone)}">📞 اتصال مباشر</a>` : `<button class="btn btn-ghost" disabled>لا يوجد هاتف</button>`}

          </button>
          <button class="share-btn wa" id="shareWA" title="واتساب">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.4.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.2-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5-.2 0-.4 0-.6 0-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.2 3 .1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.2-1.3c1.4.8 3 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
          </button>
          <button class="share-btn tw" id="shareTW" title="تويتر">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </button>
        </div>

        ${p.description ? `<div class="description-block"><h3>الوصف التفصيلي</h3><p>${esc(p.description)}</p></div>` : ""}
      </div>
    </div>

    <div class="reviews-section">
      <h2 class="section-title">التقييمات (${reviews.length})</h2>
      ${reviews.length ? reviews.map(r => `
        <div class="review-item">
          <div class="review-head">
            <div>
              <div class="review-author">${esc(r.authorName || "مستخدم")}</div>
              <div class="review-stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</div>
            </div>
            <div class="review-date">${formatDate(r.createdAt)}</div>
          </div>
          <div class="review-text">${esc(r.text || "")}</div>
        </div>
      `).join("") : `<p style="color:var(--text-muted);margin-bottom:16px">لا توجد تقييمات بعد</p>`}

      ${state.user ? `
        <div class="card" style="margin-top:20px">
          <h3 style="font-size:16px;margin-bottom:12px">أضف تقييمك</h3>
          <div class="form-group">
            <label class="form-label">تقييمك</label>
            <select class="form-control" id="reviewRating">
              <option value="5">★★★★★ - ممتاز</option>
              <option value="4">★★★★☆ - جيد جداً</option>
              <option value="3">★★★☆☆ - جيد</option>
              <option value="2">★★☆☆☆ - مقبول</option>
              <option value="1">★☆☆☆☆ - ضعيف</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">تعليقك</label>
            <textarea class="form-control" id="reviewText" rows="3" placeholder="اكتب تجربتك مع المنتج..."></textarea>
          </div>
          <button class="btn btn-primary" id="submitReviewBtn">إرسال التقييم</button>
        </div>
      ` : `<p style="color:var(--text-muted);margin-top:16px"><a href="#/login" style="color:var(--gold)">سجّل دخولك</a> لإضافة تقييم</p>`}
    </div>`;

  $("#galleryThumbs").querySelectorAll(".thumb").forEach(t => {
    t.onclick = () => {
      $("#mainImg").src = t.dataset.img;
      $("#galleryThumbs").querySelectorAll(".thumb").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    };
  });
  $("#shareProductBtn").onclick = () => { copyText(shareUrl); toast("تم نسخ رابط المنتج", "success"); };
  $("#shareWA").onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(p.name + " - " + shareUrl)}`, "_blank");
  $("#shareTW").onclick = () => window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(p.name)}&url=${encodeURIComponent(shareUrl)}`, "_blank");
  $("#shareFB").onclick = () => window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, "_blank");
  $("#shareTG").onclick = () => window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(p.name)}`, "_blank");

  if ($("#submitReviewBtn")) {
    $("#submitReviewBtn").onclick = async () => {
      const rating = Number($("#reviewRating").value);
      const text = $("#reviewText").value.trim();
      if (!rating) return;
      try {
        showLoader(true, "جارٍ إرسال التقييم...");
        await dbSet(dbRef(db, `reviews/${pid}/${state.user.uid}`), {
          authorId: state.user.uid,
          authorName: state.profile?.name || "مستخدم",
          rating,
          text,
          createdAt: Date.now()
        });
        // Recalculate average
        const allReviews = await dbGet(dbRef(db, "reviews/" + pid));
        const data = allReviews.val() || {};
        const list = Object.values(data);
        const avg = list.reduce((s, r) => s + (r.rating || 0), 0) / list.length;
        await dbUpdate(dbRef(db, "products/" + pid), {
          ratingAvg: Math.round(avg * 10) / 10,
          ratingCount: list.length
        });
        toast("تم إرسال تقييمك ✅", "success");
        renderProduct(pid);
      } catch (e) {
        toast(e.message || "تعذر إرسال التقييم", "error");
      } finally { showLoader(false); }
    };
  }
}

    $("#dashCopyBtn").onclick = async () => {
      await copyText($("#dashStoreUrl").value);
      toast("تم نسخ رابط المتجر", "success");
    };
    $("#dashShareBtn").onclick = () => shareUrl_(storeUrl, store.name);
  }

  window.__editProduct = (pid) => navigate("#/dashboard/product/" + pid);
  window.__deleteProduct = async (pid) => {
    const ok = await confirmDialog("هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع.", "حذف منتج");
    if (!ok) return;
    try {
      showLoader(true, "جارٍ الحذف...");
      const prodSnap = await dbGet(dbRef(db, "products/" + pid));
      const prod = prodSnap.val();
      if (prod?.images) {
        for (const img of prod.images) { try { await deleteImageByUrl(img); } catch {} }
      }
      await dbRemove(dbRef(db, "products/" + pid));
      toast("تم حذف المنتج", "success");
      await loadMyProducts(state.user.uid);
      renderDashboard();
    } catch (e) {
      toast(e.message, "error");
    } finally { showLoader(false); }
  };
}

    }

  slugInput.addEventListener("blur", () => { slugInput.dataset.touched = "1"; });

  $("#logoZone").onclick = () => $("#logoInput").click();
  $("#logoInput").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    logoFile = f;
    $("#logoPreview").innerHTML = `<div class="preview-item"><img src="${objectURL(f)}" /></div>`;
  };
  $("#coverZone").onclick = () => $("#coverInput").click();
  $("#coverInput").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    coverFile = f;
    $("#coverPreview").innerHTML = `<div class="preview-item"><img src="${objectURL(f)}" /></div>`;

  $("#coverPreview").addEventListener("click", (e) => {

    btn.disabled = true; const original = btn.textContent; btn.textContent = "جارٍ الحفظ...";
    try {
      showLoader(true, "جارٍ رفع الصور وحفظ البيانات...");
      let logoUrl = currentLogo;
      let coverUrl = currentCover;

      if (coverFile) coverUrl = await uploadImage(coverFile, `stores/${state.user.uid}/cover`);

        uid: state.user.uid,
        name, slug,
        description: $("#sDesc").value.trim(),
        whatsapp: $("#sWhatsapp").value.trim(),
        phone: $("#sPhone").value.trim(),
        country: $("#sCountry").value,

        cover: coverUrl || "",

        updatedAt: Date.now(),
        createdAt: store.createdAt || Date.now()

    } catch (err) {
      console.error(err);

      errEl.classList.add("show");
    } finally {
      showLoader(false);
      btn.disabled = false; btn.textContent = original;
    }
  };

  if (isEdit) {
    $("#deleteStoreBtn").onclick = async () => {
      const ok = await confirmDialog("سيتم حذف المتجر وجميع منتجاته نهائياً. هل تريد المتابعة؟", "حذف المتجر");
      if (!ok) return;
      try {
        showLoader(true, "جارٍ الحذف...");
        const prodSnap = await dbGet(query(dbRef(db, "products"), orderByChild("ownerId"), equalTo(state.user.uid)));
        const prods = prodSnap.val() || {};
        for (const [id, p] of Object.entries(prods)) {
          if (p.images) for (const img of p.images) { try { await deleteImageByUrl(img); } catch {} }
          await dbRemove(dbRef(db, "products/" + id));
        }
        if (store.logo) try { await deleteImageByUrl(store.logo); } catch {}
        if (store.cover) try { await deleteImageByUrl(store.cover); } catch {}
        await dbRemove(dbRef(db, `stores/${state.user.uid}`));
        state.myStore = null;
        toast("تم حذف المتجر", "success");
        navigate("#/dashboard");
      } catch (e) { toast(e.message, "error"); }
      finally { showLoader(false); }
    };
  }
}

        <div class="form-group">
          <label class="form-label">رقم الهاتف</label>
          <input type="tel" class="form-control" id="pPhone" value="${esc(product.phone || state.myStore.phone || "")}" placeholder="+9665xxxxxxxx" dir="ltr" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">صور المنتج (حتى 5 صور) <span class="req">*</span></label>
        <div class="upload-zone" id="imagesZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          <p>اضغط لرفع صور المنتج</p><small>يمكنك اختيار عدة صور - الحد الأقصى 5MB لكل صورة</small>
        </div>
        <input type="file" accept="image/*" multiple id="imagesInput" class="hidden" />
        <div class="upload-preview" id="imagesPreview"></div>
        <div class="form-help" id="imagesCount">0 / 5 صور</div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <input type="checkbox" id="pFeatured" ${product.featured ? 'checked' : ''} style="width:auto;margin-left:6px" />
          ⭐ منتج مميز (يظهر في الصفحة الرئيسية)
        </label>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn btn-primary btn-lg" id="publishBtn">${isEdit ? "حفظ ونشر" : "🚀 نشر المنتج"}</button>
        <button type="button" class="btn btn-ghost" id="draftBtn">${isEdit ? "حفظ كمسودة" : "حفظ كمسودة"}</button>
        ${isEdit ? `<button type="button" class="btn btn-danger" id="deleteProdBtn">حذف المنتج</button>` : ""}
      </div>
    </form>`;

  let newImageFiles = [];
  let existingImages = Array.isArray(product.images) ? [...product.images] : [];

  function renderPreview() {
    const preview = $("#imagesPreview");
    preview.innerHTML = "";
    existingImages.forEach((url, idx) => {
      const div = document.createElement("div");
      div.className = "preview-item";
      div.innerHTML = `<img src="${esc(url)}" /><button type="button" class="remove-img" data-ex="${idx}">×</button>`;
      preview.appendChild(div);
    });
    newImageFiles.forEach((f, idx) => {
      const div = document.createElement("div");
      div.className = "preview-item";
      div.innerHTML = `<img src="${objectURL(f)}" /><button type="button" class="remove-img" data-new="${idx}">×</button>`;
      preview.appendChild(div);
    });
    const countEl = $("#imagesCount");
    if (countEl) countEl.textContent = `${existingImages.length + newImageFiles.length} / 5 صور`;
  }
  renderPreview();

  $("#imagesPreview").addEventListener("click", (e) => {
    if (e.target.dataset.ex != null) {
      const i = Number(e.target.dataset.ex);
      existingImages.splice(i, 1); renderPreview();
    } else if (e.target.dataset.new != null) {
      const i = Number(e.target.dataset.new);
      newImageFiles.splice(i, 1); renderPreview();
    }
  });

  $("#imagesZone").onclick = () => $("#imagesInput").click();
  $("#imagesInput").onchange = (e) => {
    const files = Array.from(e.target.files || []);
    const remaining = 5 - existingImages.length - newImageFiles.length;
    if (remaining <= 0) { toast("الحد الأقصى 5 صور", "warning"); return; }
    for (const f of files.slice(0, remaining)) {
      if (!f.type.startsWith("image/")) { toast(`الملف "${f.name}" ليس صورة`, "warning"); continue; }
      if (f.size > 5 * 1024 * 1024) { toast(`الصورة "${f.name}" أكبر من 5MB`, "warning"); continue; }
      newImageFiles.push(f);
    }
    if (files.length > remaining) toast(`تمت إضافة ${remaining} صورة فقط (الحد الأقصى 5)`, "warning");
    renderPreview();
    e.target.value = "";
  };

  async function saveProduct(publish) {
    const errEl = $("#prodError"); errEl.classList.remove("show");
    const name = $("#pName").value.trim();
    const price = Number($("#pPrice").value);
    const whatsapp = $("#pWhatsapp").value.trim();

    if (!name) { errEl.textContent = "اسم المنتج مطلوب"; errEl.classList.add("show"); return; }
    if (!price || price <= 0) { errEl.textContent = "السعر مطلوب وأكبر من صفر"; errEl.classList.add("show"); return; }
    if (!whatsapp) { errEl.textContent = "رقم الواتساب مطلوب"; errEl.classList.add("show"); return; }
    if (existingImages.length + newImageFiles.length === 0) {
      errEl.textContent = "أضف صورة واحدة على الأقل للمنتج"; errEl.classList.add("show"); return;
    }
    const oldPriceVal = $("#pOldPrice").value;
    if (oldPriceVal && Number(oldPriceVal) > 0 && Number(oldPriceVal) <= price) {
      errEl.textContent = "السعر قبل الخصم يجب أن يكون أعلى من السعر بعد الخصم";
      errEl.classList.add("show"); return;
    }

    const btn = publish ? $("#publishBtn") : $("#draftBtn");
    btn.disabled = true;
    const origText = btn.textContent;
    btn.textContent = "جارٍ الحفظ...";
    try {
      showLoader(true, "جارٍ رفع الصور وحفظ المنتج...");
      const uploaded = [];
      for (const f of newImageFiles) {
        const url = await uploadImage(f, `products/${state.user.uid}`);
        if (url) uploaded.push(url);
      }
      const allImages = [...existingImages, ...uploaded];

      const payload = {
        ownerId: state.user.uid,
        ownerEmail: state.user.email || "",
        storeSlug: storeSlug || "",
        name,
        description: $("#pDesc").value.trim(),
        price,
        oldPrice: oldPriceVal ? Number(oldPriceVal) : null,
        currency: $("#pCurrency").value || "SAR",
        category: $("#pCategory").value || "أخرى",
        condition: $("#pCondition").value || "new",
        quantity: $("#pQuantity").value ? Number($("#pQuantity").value) : null,
        available: $("#pAvailable").checked,
        featured: $("#pFeatured").checked || false,
        whatsapp,
        phone: $("#pPhone").value.trim(),
        images: allImages,
        status: publish ? "published" : "draft",
        updatedAt: Date.now(),
        createdAt: product.createdAt || Date.now(),
        views: product.views || 0,
        ratingAvg: product.ratingAvg || 0,
        ratingCount: product.ratingCount || 0
      };

      if (isEdit) {
        await dbUpdate(dbRef(db, "products/" + pid), payload);
        toast(publish ? "تم تحديث ونشر المنتج ✅" : "تم حفظ المنتج كمسودة", "success");
      } else {
        const newRef = dbPush(dbRef(db, "products"));
        await dbSet(newRef, payload);
        const shareLink = `${location.origin}${location.pathname}?p=${newRef.key}`;
        toast(publish ? "تم نشر المنتج بنجاح 🎉" : "تم حفظ المنتج كمسودة", "success");
        if (publish) {
          copyText(shareLink);
          toast("تم نسخ رابط المنتج تلقائياً", "info", 2500);
        }
      }
      await loadMyProducts(state.user.uid);
      navigate("#/dashboard");
    } catch (err) {
      console.error(err);
      let msg = err.message || "تعذر حفظ المنتج";
      if (err.code === "storage/unauthorized") msg = "ليس لديك صلاحية الرفع. تحقق من قواعد Firebase Storage";
      else if (err.code === "storage/quota-exceeded") msg = "تم تجاوز الحصة التخزينية";
      else if (err.code === "storage/canceled") msg = "تم إلغاء الرفع";
      else if (err.code === "storage/unknown") msg = "خطأ في الرفع، تحقق من اتصالك";
      errEl.textContent = msg;
      errEl.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } finally {
      showLoader(false);
      btn.disabled = false; btn.textContent = origText;
    }
  }

  $("#publishBtn").onclick = () => saveProduct(true);
  $("#draftBtn").onclick = () => saveProduct(false);

  if (isEdit) {
    $("#deleteProdBtn").onclick = async () => {
      const ok = await confirmDialog("هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع.", "حذف منتج");
      if (!ok) return;
      try {
        showLoader(true, "جارٍ الحذف...");
        for (const img of existingImages) { try { await deleteImageByUrl(img); } catch {} }
        await dbRemove(dbRef(db, "products/" + pid));
        await dbRemove(dbRef(db, "reviews/" + pid));
        toast("تم حذف المنتج", "success");
        await loadMyProducts(state.user.uid);
        navigate("#/dashboard");
      } catch (e) { toast(e.message, "error"); }
      finally { showLoader(false); }
    };
  }
}

/* ================= RENDER: SETTINGS ================= */
async function renderSettings() {
  if (!state.user) { navigate("#/login"); return; }
  const profile = state.profile || {};

  appEl.innerHTML = `
    <div class="dashboard-header">
      <div>
        <h1>إعدادات الحساب</h1>
        <p class="subtitle">إدارة ملفك الشخصي</p>
      </div>
      <a class="btn btn-ghost" href="#/dashboard">← رجوع</a>
    </div>

    <div class="form-error" id="setError"></div>

    <form class="card" id="settingsForm" style="max-width:600px">
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <input type="text" class="form-control" id="setName" value="${esc(profile.name || '')}" required />
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" value="${esc(state.user.email || '')}" disabled />
        <div class="form-help">لا يمكن تغيير البريد الإلكتروني</div>
      </div>
      <div class="form-group">
        <label class="form-label">تاريخ الانضمام</label>
        <input type="text" class="form-control" value="${formatDate(profile.createdAt)}" disabled />
      </div>
      <button type="submit" class="btn btn-primary btn-lg">حفظ التغييرات</button>
    </form>

    <div class="card" style="max-width:600px;margin-top:20px">
      <h3 class="section-title">تسجيل الخروج</h3>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px">سيتم تسجيل خروجك من هذا الجهاز</p>
      <button class="btn btn-danger" id="setLogoutBtn">تسجيل الخروج</button>
    </div>`;

  $("#settingsForm").onsubmit = async (e) => {
    e.preventDefault();
    const errEl = $("#setError"); errEl.classList.remove("show");
    const name = $("#setName").value.trim();
    if (!name) { errEl.textContent = "الاسم مطلوب"; errEl.classList.add("show"); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "جارٍ الحفظ...";
    try {
      await updateProfile(state.user, { displayName: name });
      await dbUpdate(dbRef(db, `users/${state.user.uid}`), { name });
      state.profile.name = name;
      updateAuthUI();
      toast("تم تحديث البيانات", "success");
    } catch (err) { toast(err.message, "error"); }
    finally { btn.disabled = false; btn.textContent = "حفظ التغييرات"; }
  };

  $("#setLogoutBtn").onclick = handleLogout;
}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>

      <a class="btn btn-primary" href="#/">العودة للرئيسية</a>
    </div>`;
}

/* ================= BOOT ================= */
document.addEventListener("DOMContentLoaded", () => {
  $("#year").textContent = new Date().getFullYear();

  $("#navToggle").onclick = () => $("#navLinks").classList.toggle("open");

  $("#userBtn")?.addEventListener("click", (e) => {
    e.stopPropagation();
    $("#userDropdown").classList.toggle("open");
  });
  document.addEventListener("click", () => {
    $("#userDropdown")?.classList.remove("open");
  });

  $("#logoutBtn").onclick = handleLogout;

  $("#floatingHelp").onclick = () => {
    window.open("https://wa.me/966500000000?text=" + encodeURIComponent("مرحباً، أحتاج مساعدة في منصة ZEVORA"), "_blank");
  };

  const params = new URLSearchParams(location.search);
  const directStore = params.get("s");
  const directProduct = params.get("p");
  if (directStore) {
    navigate("#/store/" + directStore);
  } else if (directProduct) {
    navigate("#/product/" + directProduct);
  } else if (!location.hash) {
    location.hash = "#/";
  }

  window.addEventListener("hashchange", router);
  router();
});
</script>
